<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faça o login</title>
  <link rel="stylesheet" href="dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-bg">
<div class="d-flex justify-content-center gap-2 mt-5">
    <button
        id="aumentarFonte"
        class="btn btn-outline-light btn-sm"
        type="button"
        aria-label="Aumentar fonte"
    >
        A+
    </button>

    <button
        id="diminuirFonte"
        class="btn btn-outline-light btn-sm"
        type="button"
        aria-label="Diminuir fonte"
    >
        A-
    </button>

    <button
        id="contrasteNavbar"
        class="btn btn-outline-light btn-sm"
        type="button"
        aria-pressed="false"
    >
        Contraste
    </button>
</div>
  <main class="login-bg"> 

    
<form id="loginForm"  aria-describedby="login-descricao">
<section class="gradient-custom">
  <div class="container py-5 h-100">
    <div class="row d-flex justify-content-center align-items-center h-100">
      <div class="col-12 col-md-8 col-lg-6 col-xl-5">
  <div class="card bg-white text-dark" style="border-radius: 1rem;">
<div class="card-body p-3 text-center">
    <div class="mt-2 mb-2">

  <h1 class="fw-bold mb-2 text-uppercase">
    Login
</h1>
<p
    id="login-descricao"
    class="text-dark mb-5"
>
    Por favor, insira seu nome de usuário e senha
</p>

              <div data-mdb-input-init class="form-outline form-white mb-4">
              <input type="text" id="usuario" class="form-control form-control-lg"  autocomplete="username" />

                <label class="form-label" for="usuario">Usuário</label>
              </div>

              <div data-mdb-input-init class="form-outline form-white mb-4">
<input type="password" id="senha" class="form-control form-control-lg" autocomplete="current-password" />
                <label class="form-label" for="senha">Senha</label>
              </div>

<button type="submit" class="btn btn-verde-agua btn-lg px-5">
    Entrar
</button>

<p
    id="erro-login"
    class="text-danger mt-2"
    aria-live="assertive"
    role="alert"
></p>
</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
</form>


</main> 
<script src="./javascript/login.js"></script>
<script src="./javascript/acessibilidade.js"></script>

</body>
</html>
